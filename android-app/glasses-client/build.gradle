plugins {
    id "com.android.application"
}

android {
    namespace "ai.liquid.lfm.glasses"
    compileSdk 35

    defaultConfig {
        applicationId "ai.liquid.lfm.glasses"
        minSdk 24
        // Rokid Glasses ship Android 12 (API 31/32); targeting 32 keeps the
        // legacy Bluetooth APIs and notification behaviour that vendor builds
        // are known to honour.
        targetSdk 32
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
