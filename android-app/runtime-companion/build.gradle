plugins {
    id "com.android.application"
}
def externalJniDir = System.getenv("RUNTIME_COMPANION_JNI_DIR")

android {
    namespace "ai.liquid.lfmdemo.runtime"
    compileSdk 35

    defaultConfig {
        applicationId "ai.liquid.lfmdemo.runtime"
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName "0.1.0-unplugged-runtime"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            if (externalJniDir) {
                jniLibs.srcDir externalJniDir
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ["**/*.so"]
        }
    }
}
